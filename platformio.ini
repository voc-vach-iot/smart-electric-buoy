; ==========================================
; TÀI LIỆU CẤU HÌNH BIÊN DỊCH CHÍNH (PLATFORMIO)
; ==========================================

[platformio]
# Nhập file cấu hình nền tảng dùng chung
extra_configs = base_config.ini

# Mặc định chọn bộ quản lý nguồn CH32V003 khi nhấn Biên dịch nhanh
default_envs = ch32v003_power_manager

; ------------------------------------------
; 1. KHỐI ĐIỀU KHIỂN NGUỒN & KÍCH RESET (CH32V003 SOP8)
; ------------------------------------------

; Bộ quản lý nguồn đặt tại Phao nước (Giám sát phao, kích RST và Handshake)
[env:ch32v003_power_manager]
extends = _base_ch32v003
board = genericCH32V003J4M6
build_src_filter = -<*> +<ch32v003/*.c>
build_flags = -D CH32V003_J4M6
lib_deps =
    https://github.com/voc-vach-iot-ch32v003/ch32v003_delay.git
    https://github.com/voc-vach-iot-ch32v003/ch32v003_gpio.git
    https://github.com/voc-vach-iot-ch32v003/ch32v003_debug.git
    https://github.com/voc-vach-iot-ch32v003/ch32v003_power.git

; ------------------------------------------
; 2. KHỐI TRUYỀN THÔNG KHÔNG DÂY (ESP-01S)
; ------------------------------------------

; Mạch Phát - Đặt ở phao nước (Nhận diện xung kích từ CH32 và bắn ESP-NOW)
[env:esp01s_sender_uart]
extends = _base_esp01_s, _upload_method_uart
build_src_filter = -<*> +<esp-01/sender.cpp>
build_flags =
    -D SENDER_MODE
    -D COMPAT_WITHOUT_ADCVCC
lib_deps =
    ESP8266WiFi
    EEPROM

; Mạch Phát nạp qua ESP32 passthrough (khi không mang mạch nạp)
[env:esp01s_sender_passthrough]
extends = env:esp01s_sender_uart, _upload_method_passthrough

; Mạch Nhận - Đặt ở máy bơm (Nhận lệnh ESP-NOW để đóng cắt relay bơm)
[env:esp01s_receiver_uart]
extends = _base_esp01_s, _upload_method_uart
build_src_filter = -<*> +<esp-01/receiver.cpp>
board_build.ldscript = eagle.flash.1m.ld
build_flags =
    -D RECEIVER_MODE
lib_deps =
    ESP8266WiFi
    ESP8266WebServer
    DNSServer
    tzapu/WiFiManager
    blynkkk/Blynk
    paulstoffregen/Time @ ^1.6.1


; ---- CHẾ ĐỘ NẠP TẠM QUA OTA (khi không mang mạch nạp) ----
; Wi-Fi cố định + ArduinoOTA, bỏ WiFiManager cho firmware nhỏ. Có mạch nạp thì quay về env ở trên
[_receiver_ota_common]
extends = env:esp01s_receiver_uart
build_flags =
    -D RECEIVER_MODE
    -D OTA_ENABLE
lib_deps =
    ESP8266WiFi
    ESP8266mDNS
    ArduinoOTA
    blynkkk/Blynk
    paulstoffregen/Time @ ^1.6.1

; Lần nạp đầu: qua ESP32 passthrough
[env:esp01s_receiver_passthrough]
extends = _receiver_ota_common, _upload_method_passthrough

; Các lần sau: qua Wi-Fi
[env:esp01s_receiver_ota]
extends = _receiver_ota_common, _upload_method_ota

; ------------------------------------------
; 3. CÔNG CỤ: ESP32 LÀM CẦU NẠP CHO ESP-01 (PASSTHROUGH)
; ------------------------------------------
[env:esp32_passthrough]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<esp32/passthrough.cpp>
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Công cụ: ESP32 giả lập CH32V003 để test sender trên bàn (gửi E/F qua Serial)
[env:esp32_ch32_emulator]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<esp32/ch32_emulator.cpp>
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Công cụ: ESP32 ghi áp VCC + chân ACK của ESP-01 trên bo phao (đo sụt áp / CH32 cắt nguồn sớm)
[env:esp32_power_probe]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<esp32/power_probe.cpp>
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
