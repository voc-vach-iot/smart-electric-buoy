[env]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 74880
lib_deps =
    ESP8266WiFi

; Môi trường cho con Phát (Phao)
[env:sender]
build_src_filter = +<sender.cpp> -<receiver.cpp>
build_flags = -D SENDER_MODE

; Môi trường cho con Nhận (Máy bơm)
[env:receiver]
build_src_filter = -<sender.cpp> +<receiver.cpp>
build_flags = -D RECEIVER_MODE
lib_deps =
    WiFiManager
    Blynk
    paulstoffregen/Time @ ^1.6.1