; ==========================================
; CẤU HÌNH NỀN TẢNG DÙNG CHUNG (BASE CONFIG)
; ==========================================

[_base_esp01_s]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 74880
lib_ldf_mode = off

[_upload_method_uart]
upload_speed = 921000

; Cấu hình nền tảng mặc định cho dòng CH32V003 dùng ch32v003fun
[_base_ch32v003]
platform = ch32v
framework = ch32v003fun
upload_protocol = minichlink
debug_tool = minichlink
extra_scripts = ch32v003_extra_scripts.py
