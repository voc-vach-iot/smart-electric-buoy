; ==========================================
; CẤU HÌNH NỀN TẢNG DÙNG CHUNG (BASE CONFIG)
; ==========================================

[_base_esp01_s]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 74880
lib_ldf_mode = off

[_upload_method_uart]
upload_speed = 921000

; Nạp qua ESP32 làm cầu UART (passthrough). Baud cố định 115200 để esptool không đổi baud
[_upload_method_passthrough]
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; Nạp qua Wi-Fi (ArduinoOTA). Nếu máy không phân giải được .local thì thay bằng IP của receiver
[_upload_method_ota]
upload_protocol = espota
upload_port = bom-dien.local
upload_flags =
    --port=8266
    --auth=${secrets.ota_password}

; Cấu hình nền tảng mặc định cho dòng CH32V003 dùng ch32v003fun
[_base_ch32v003]
platform = ch32v
framework = ch32v003fun
upload_protocol = minichlink
debug_tool = minichlink
extra_scripts = ch32v003_extra_scripts.py
lib_ldf_mode = deep+